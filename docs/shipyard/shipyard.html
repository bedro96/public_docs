.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

:root {
  --paper: #eaeff2;
  --panel: #f7f9fa;
  --fig: #f3f6f7;
  --ink: #14222e;
  --ink2: #4a5b69;
  --line: #c3cfd7;
  --blue: #1f5f8b;
  --accent: #c2410c;
  --focus: #0b5cad;
  --sans: Barun, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --head: Square, Barun, "Noto Sans KR", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
  font: 400 14px/1.5 var(--sans); display: flex; flex-direction: column; word-break: keep-all; overflow-wrap: break-word;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 20; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; }
.skip:focus { top: 8px; }

/* ---- bilingual pairs: Korean first and larger, English beneath and quieter ---- */
.bi { display: block; }
.bi .kr { display: block; font-weight: 700; }
.bi .en { display: block; font-size: .84em; color: var(--ink2); font-weight: 400; line-height: 1.3; }
.bi.what .kr { font-weight: 400; font-size: 14px; line-height: 1.55; }
.bi.what .en { font-size: 12px; margin-top: 2px; }
.bi.inl { display: inline-block; }

/* ---- header ---- */
.top {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 8px 20px;
  padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand h1 { margin: 0; font: 700 20px/1.2 var(--head); }
.brand h1 span[lang="en"] { font: 400 13px/1.2 var(--sans); color: var(--ink2); margin-left: 8px; }
.tagline { margin: 1px 0 0; font-size: 12px; color: var(--ink2); }
.tabs { display: flex; gap: 4px; padding: 3px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 4px 16px; border-radius: 6px; min-height: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.15; }
.tab span[lang="ko"] { font-weight: 700; font-size: 14px; }
.tab span[lang="en"] { font-size: 11px; color: var(--ink2); }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.tab[aria-selected="true"] span[lang="en"] { color: #d5dfe6; }
.status { margin: 0; min-width: 0; text-align: right; font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- layout ---- */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; padding: 12px 14px 14px; }
.stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.viewport { position: relative; flex: 1 1 auto; min-height: 260px; border: 1px solid var(--line); background: var(--fig); overflow: hidden; border-radius: 6px; }
.panel { position: absolute; inset: 0; }
.panel .fig { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
.side { min-width: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
@media (min-width: 861px) { body { height: 100vh; } .layout { overflow: hidden; } }

/* ---- tags: numbered markers laid over the figure ---- */
.tags { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; padding: 0; border: 0; background: transparent; width: 28px; height: 28px; display: grid; place-items: center; }
.tag .n, .chip .n, .step .n, .lt .dot { font-style: normal; }
.tag .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font: 700 11px/1 var(--mono); border: 2px solid var(--panel); box-shadow: 0 1px 3px #14222e55; }
.tag.on .n { background: var(--accent); }
.tag .bi { display: none; position: absolute; bottom: calc(100% - 2px); left: 50%; transform: translateX(-50%); z-index: 3; background: var(--ink); color: #fff; padding: 4px 9px; border-radius: 6px; white-space: nowrap; font-size: 12px; text-align: left; pointer-events: none; }
.tag .bi .en { color: #c9d6df; font-size: 11px; }
.tag.flip .bi { left: auto; right: 0; transform: none; }
.tag:hover .bi, .tag:focus-visible .bi, .tag.on .bi { display: block; }
.note { position: absolute; left: 8px; bottom: 6px; margin: 0; max-width: 78%; font-size: 11px; color: var(--ink2); pointer-events: none; padding: 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--fig) 86%, transparent); }
.note .bi { display: flex; gap: 8px; flex-wrap: wrap; }
.note .bi .kr, .note .bi .en { display: inline; font-weight: 400; font-size: 11px; }
.fallback { position: absolute; inset: auto 12px 12px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; margin: 0; }

/* ---- controls ---- */
.controls { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { min-height: 42px; padding: 3px 14px; border: 1px solid var(--ink); background: var(--panel); border-radius: 7px; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.15; }
.btn span[lang="ko"], .btn .bi .kr { font-weight: 700; font-size: 14px; }
.btn span[lang="en"], .btn .bi .en { font-size: 11px; color: var(--ink2); }
.btn .bi { text-align: center; }
.btn:hover { background: #fff; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
.btn.primary span[lang="en"], .btn.primary .bi .en { color: #fff1e8; }
.btn.primary:hover { background: #a8380a; }
.btn.quiet { border-color: var(--line); }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.step { position: relative; width: 100%; height: 100%; display: flex; gap: 6px; align-items: flex-start; text-align: left; padding: 5px 6px 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; overflow: hidden; }
.step .n { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink); font: 700 11px/1 var(--mono); }
.step .bi .kr { font-size: 12.5px; line-height: 1.25; }
.step .bi .en { font-size: 11px; line-height: 1.2; }
.step::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p, 0) * 100%); background: var(--blue); }
.step.done .n { background: var(--blue); color: #fff; }
.step[aria-current="step"] { border-color: var(--ink); background: #fff; }
.step[aria-current="step"] .n { background: var(--accent); color: #fff; }

<script>"use strict";
const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);

    const cc = craneCycle(i, c);
    Y.crane = cc; Y.crane.i = i;
    if (u >= 0.999) { Y.placed = N; Y.active = -1; }
    Y.wp = { form: 'none', x: 0, y: 0, z: 0, paint: 1, show: 0 };
    Y.readout = { block: Math.min(N, i + 1), tonnes: BLOCKS[i].tonnes, phase: cc.phase, placed: Y.placed };
  } else if (s === 5) {                           // flood and launch
    Y.placed = BLOCKS.length; Y.shipShow = true;
    const f = seg(u, 0.04, 0.58);
    Y.water = f;
    const lvl = levelAt(f);
    const lift = clamp((lvl - floatLevel()) / (DOCK.depth - floatLevel()));   // 0..1 of the way up
    Y.ship.dz = lift * (LAYOUT.seaLevel - (LAYOUT.floor + LAYOUT.keelH + HULL.draftUnits));
    Y.gate = seg(u, 0.6, 0.68);
    const out = seg(u, 0.7, 0.99);
    Y.ship.dx = out * LAYOUT.mooring.dx;
    Y.crane = { gx: REST_GX, ty: slotY(), hook: LAYOUT.craneZ - 22, load: null, phase: 'park' };
    Y.readout = { levelM: lvl, hours: f * floodHours(), floats: lvl >= floatLevel(), out };
  } else {                                        // quay outfitting, sea trials
    Y.placed = BLOCKS.length; Y.shipShow = true; Y.water = 1; Y.gate = 1;
    Y.ship.dx = LAYOUT.mooring.dx; Y.ship.dz = LAYOUT.seaLevel - (LAYOUT.floor + LAYOUT.keelH + HULL.draftUnits);
    Y.house = seg(u, 0.08, 0.5);                  // deckhouse lowered onto the ship by the quay crane
    Y.jib = Y.house;
    const sail = seg(u, 0.6, 0.99);
    Y.sail = sail;
    Y.ship.dx += sail * 330;
    Y.ship.op = 1 - seg(u, 0.82, 0.98);
    Y.readout = { house: Y.house, sail, knots: 22 * sail };
  }
  return Y;
}

// Geometry helpers shared by the yard and the vessel. They take the kit (K) and a projection (P)
// so the same code runs in Node (static figure) and in the page (parts that are rebuilt every frame).

/** a thing the sorter can place: svg markup + an axis aligned box [x0,x1,y0,y1,z0,z1] */
const part = (svg, bb, extra = {}) => ({ svg, bb, ...extra });

function tools(K, P) {
  const tone = (o) => ({ tone: o.tone || 'hi', crease: o.crease || 'faint', lit: o.lit, flat: o.flat, className: o.cls, halo: o.halo });

  /** axis aligned box */
  const box = (x, y, z, w, d, h, o = {}) =>
    part(K.solidSvg(K.slabOf({ x, y, w, d, r: o.r || 0 }, z, h, P, 5, o.bevel || 0), tone(o)), [x, x + w, y, y + d, z, z + h], o);

  /** vertical cylinder */
  const post = (cx, cy, z, h, r, o = {}) =>
    part(K.solidSvg(K.cylinder(cx, cy, r, z, h, P, o.steps || 14, o.bevel || 0), tone(o)), [cx - r, cx + r, cy - r, cy + r, z, z + h], o);

  /** vertical prism over any ring of [x,y] points */
  const prism = (ringPts, z, h, o = {}) => {
    const xs = ringPts.map((p) => p[0]), ys = ringPts.map((p) => p[1]);
    return part(K.solidSvg(K.extrude(ringPts, z, h, P, { convex: o.convex ?? true, bevel: o.bevel || 0 }), tone(o)),
      [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys), z, z + h], o);
  };

  /** a polyline in 3D (points are [x,y,z]) */
  const line = (pts, o = {}) => {
    const d = K.pathOf(pts.map((p) => K.iso(p, P)));
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]), zs = pts.map((p) => p[2]);
    return part(K.lineSvg(d, { tone: o.tone || 'mid', dashed: o.dashed, dotted: o.dotted, flow: o.flow, className: o.cls }),
      [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys), Math.min(...zs), Math.max(...zs)], { ...o, line: true });
  };

  /** closed polygon outline flat on a plane z (a painted marking, a footprint) */
  const mark = (ringPts, z, o = {}) => {
    const d = K.onTop(ringPts, z, P, true);
    const xs = ringPts.map((p) => p[0]), ys = ringPts.map((p) => p[1]);
    return part(K.lineSvg(d, { tone: o.tone || 'lo', dashed: o.dashed, className: o.cls }), [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys), z, z], { ...o, line: true });
  };

  /** a flat filled polygon lying on plane z (a road, a pad, water top) */
  const flatPoly = (ringPts, z, o = {}) => {
    const pts = ringPts.map(([x, y]) => K.iso([x, y, z], P));
    const d = K.pathOf(pts, true);
    const xs = ringPts.map((p) => p[0]), ys = ringPts.map((p) => p[1]);
    return part(`<g class="${o.cls || 'iso-solid'}"><path class="iso-fill" d="${d}"/><path class="iso-top" d="${d}"/><path class="iso-line iso-edge" data-tone="${o.tone || 'faint'}" d="${d}"/></g>`,
      [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys), z, z + 0.01], o);
  };

  /**
   * a horizontal cylinder along the x or y axis; centre c = [x,y,z], radius r, length len.
   * Drawn like the kit's extrusions: facets bucketed by light, silhouette on the outside, the near cap on top.
   */
  const hcyl = (axis, c, r, len, o = {}) => {
    const A = axis === 'x' ? 0 : 1;
    const n = o.steps || 20;
    const ringAt = (a) => Array.from({ length: n }, (_, i) => {
      const t = (i / n) * Math.PI * 2;
      const u = r * Math.cos(t), v = r * Math.sin(t);
      return A === 0 ? [c[0] + a, c[1] + u, c[2] + v] : [c[0] + u, c[1] + a, c[2] + v];
    });
    const a0 = -len / 2, a1 = len / 2;
    const r0 = ringAt(a0).map((p) => K.iso(p, P)), r1 = ringAt(a1).map((p) => K.iso(p, P));
    const cam = K.towardViewer(P);          // [cosA, sinA]
    const buckets = [[], [], [], []];
    const all = [...r0, ...r1];
    for (let i = 0; i < n; i++) {
      const t = ((i + 0.5) / n) * Math.PI * 2;
      const nrm = A === 0 ? [0, Math.cos(t), Math.sin(t)] : [Math.cos(t), 0, Math.sin(t)];
      const facing = nrm[0] * cam[0] + nrm[1] * cam[1] + 0.5 * nrm[2] > 0.02;
      if (!facing) continue;
      const lit = (nrm[2] * 0.7 + (A === 0 ? -nrm[1] : nrm[0]) * 0.55 + 1) / 2;
      const b = Math.min(3, Math.max(0, Math.floor(lit * 4)));
      const j = (i + 1) % n;
      buckets[b].push(K.pathOf([r0[i], r0[j], r1[j], r1[i]], true));
    }
    // the cap that faces the viewer is the one at +a on both axes
    const capPts = r1;
    const cap = K.pathOf(capPts, true);
    const hull = hullOf(all);
    const fill = K.pathOf(hull, true);
    const klass = o.cls ? `iso-solid ${o.cls}` : 'iso-solid';
    const shades = buckets.map((d, i) => (d.length ? `<path class="iso-shade" data-shade="${i}" d="${d.join('')}"/>` : '')).join('');
    const svg = `<g class="${klass}"${o.lit ? ' data-lit' : ''}><path class="iso-fill" d="${fill}"/>${shades}<path class="iso-top" d="${cap}"/><path class="iso-line iso-crease" data-tone="${o.crease || 'faint'}" d="${cap}"/><path class="iso-line iso-edge" data-tone="${o.tone || 'hi'}" d="${fill}"/></g>`;
    const bb = A === 0 ? [c[0] - len / 2, c[0] + len / 2, c[1] - r, c[1] + r, c[2] - r, c[2] + r] : [c[0] - r, c[0] + r, c[1] - len / 2, c[1] + len / 2, c[2] - r, c[2] + r];
    return part(svg, bb, o);
  };

  const hullOf = (points) => {
    const s = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of s) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (let i = s.length - 1; i >= 0; i--) { const p = s[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return [...lo.slice(0, -1), ...up.slice(0, -1)];
  };

  /** painter's sort of axis aligned parts: far to near. Pairs that cannot be separated fall back to depth. */
  const paint = (parts) => {
    const E = 0.05;
    const n = parts.length;
    const sep = (a, b) => (a.bb[1] <= b.bb[0] + E) || (a.bb[3] <= b.bb[2] + E) || (a.bb[5] <= b.bb[4] + E);
    const out = Array.from({ length: n }, () => []), need = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const A = parts[i], B = parts[j];
        if (A.line && B.line) continue;
        const ab = sep(A, B), ba = sep(B, A);
        if (ab && !ba) { out[i].push(j); need[j]++; }
        else if (ba && !ab) { out[j].push(i); need[i]++; }
      }
    }
    const depth = parts.map((p) => K.depthOf([(p.bb[0] + p.bb[1]) / 2, (p.bb[2] + p.bb[3]) / 2, (p.bb[4] + p.bb[5]) / 2], P) + (p.bias || 0));
    const done = new Array(n).fill(false), order = [];
    for (let k = 0; k < n; k++) {
      let pick = -1;
      for (let i = 0; i < n; i++) if (!done[i] && need[i] === 0 && (pick < 0 || depth[i] < depth[pick])) pick = i;
      if (pick < 0) for (let i = 0; i < n; i++) if (!done[i] && (pick < 0 || depth[i] < depth[pick])) pick = i;
      done[pick] = true; order.push(parts[pick]);
      for (const j of out[pick]) need[j]--;
    }
    return order;
  };

  const svgOf = (parts) => parts.map((p) => p.svg).join('');
  /** wrap markup in a group with attributes */
  const g = (inner, attrs = {}) => `<g${Object.entries(attrs).filter(([, v]) => v !== undefined && v !== false).map(([k, v]) => ` ${k}="${String(v).replace(/"/g, '&quot;')}"`).join('')}>${Array.isArray(inner) ? inner.join('') : inner}</g>`;
  /** bounding box of parts in world coordinates, as screen-space [x0,y0,x1,y1] */
  const screenBox = (parts) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of parts) {
      for (const x of [p.bb[0], p.bb[1]]) for (const y of [p.bb[2], p.bb[3]]) for (const z of [p.bb[4], p.bb[5]]) {
        const [sx, sy] = K.iso([x, y, z], P);
        x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
      }
    }
    return [x0, y0, x1, y1];
  };
  const worldBox = (parts) => parts.reduce((a, p) => [Math.min(a[0], p.bb[0]), Math.max(a[1], p.bb[1]), Math.min(a[2], p.bb[2]), Math.max(a[3], p.bb[3]), Math.min(a[4], p.bb[4]), Math.max(a[5], p.bb[5])], [Infinity, -Infinity, Infinity, -Infinity, Infinity, -Infinity]);

  return { box, post, prism, line, mark, flatPoly, hcyl, paint, svgOf, g, screenBox, worldBox, hullOf, part };
}

/** hull half-breadth (0..1) at fraction t along the ship: round stern, parallel body, pointed bow */
function halfBreadth(t) {
  if (t < 0.05) return 0.62 + 0.38 * Math.sin((t / 0.05) * Math.PI / 2);
  if (t < 0.78) return 1;
  const s = (t - 0.78) / 0.22;
  return Math.max(0.04, Math.cos(s * Math.PI / 2) ** 0.8);
}

/** plan ring (x,y) of the hull between x=a..b (fractions along L), half beam hb about y=cy */
function hullRing(L, hb, cy, a, b, steps = 6) {
  const xs = [];
  for (let i = 0; i <= steps; i++) xs.push(a + ((b - a) * i) / steps);

function select(kind, id, via) {

  S.sel = { kind, id }; S.overview = false;
  // a system that is switched off cannot be read about: switch its layer back on (the layer buttons follow)
  const sysOf = selSys();

  const d = nameOf(kind, id);
  say({ kr: `선택: ${d.kr}${revealed ? ' · 레이어를 다시 켰습니다' : ''}`, en: `Selected: ${d.en}${revealed ? ' · layer switched back on' : ''}` });

  if (rebuilt) buildTags(); else syncTags();
  renderCard(); syncChips(); syncDim();

  if (via === 'svg' || via === 'part' || (via === 'tag' && rebuilt)) R.card.focus({ preventScroll: true });
  // on a phone the card sits below the figure: bring it into view
  if (via && window.matchMedia('(max-width: 860px)').matches) R.card.scrollIntoView({ block: 'nearest', behavior: S.reduced ? 'auto' : 'smooth' });

  const hadFocus = !!ae && (R.tags.contains(ae) || ae.id === 'b-all');

  say({ kr: '전체 보기로 돌아왔습니다', en: 'Back to the full view' });

  renderCard(); syncChips(); syncDim();

// ---- the tour ----------------------------------------------------------------------------------------------------------
function stageName(i) { const s = D.STAGES[i]; return { kr: `${i + 1}단계 · ${s.kr}`, en: `Step ${i + 1} · ${s.en}` }; }
function go(i, how) {
  i = clamp(i, 0, D.STAGES.length - 1);
  S.stage = i; S.u = S.reduced ? 1 : 0; S.hold = 0; S.overview = false;
  if (S.sel && S.sel.kind === 'fac') S.sel = null;
  buildTagsIfNeeded();

}

function setPlaying(on) {

}
function renderStepper() {
  if (!R.stepper.children.length) {
    D.STAGES.forEach((st, i) => {
      const li = mk('li'); const b = mk('button', 'step'); b.type = 'button'; b.dataset.step = String(i);
      b.append(mk('i', 'n', String(i + 1)), pair(st));
      b.addEventListener('click', () => { setPlaying(false); go(i); });
      li.append(b); R.stepper.append(li);

function tourTick(dt) {
  if (!S.playing) return;
  if (S.reduced) {
    S.hold += dt;
    if (S.hold > 6) { S.hold = 0; if (S.stage < 6) go(S.stage + 1); else setPlaying(false); }
    return;
  }
  S.u += dt / STAGE_SECONDS[S.stage];
  if (S.u >= 1) {
    if (S.stage < 6) go(S.stage + 1);
    else { S.u = 1; setPlaying(false); say({ kr: '완성! 처음부터 다시 볼 수 있습니다', en: 'Done! Press Play to watch again' }); }
  }
}
const tour = {
  next() { if (S.stage >= 6) { say({ kr: '마지막 단계입니다', en: 'This is the last step' }); return; } go(S.stage + 1); },
  prev() { if (S.stage <= 0) { say({ kr: '첫 단계입니다', en: 'This is the first step' }); return; } go(S.stage - 1); },
  play() {
    if (S.playing) { setPlaying(false); say({ kr: '일시정지', en: 'Paused' }); return; }
    if (S.stage === 6 && S.u >= 0.999) go(0);
    S.sel = null; S.overview = false; setPlaying(true); syncDim(); buildTagsIfNeeded(); syncChips(); renderCard(); say({ kr: `재생: ${stageName(S.stage).kr}`, en: `Playing: ${stageName(S.stage).en}` });
  },
  // Skip jumps to the end of the CURRENT step and stays there: a playing tour is paused, otherwise the next frame would roll on into the next step
  skip() {

    if (wasPlaying) setPlaying(false);
    say(wasPlaying ? { kr: '이 단계의 끝으로 이동하고 멈춤', en: 'Jumped to the end of this step and paused' } : { kr: '이 단계의 끝으로 이동', en: 'Jumped to the end of this step' });
  },

// ---- drawing the yard ---------------------------------------------------------------------------------------------------
function drawYard(c) {
  const w = c.wp;
  R.wpMove.setAttribute('transform', move(YP, [w.x, w.y, w.z]));
  R.wpMove.setAttribute('opacity', w.show.toFixed(2));
  for (const f of Object.keys(R.wpf)) R.wpf[f].style.display = w.form === f ? '' : 'none';
  const reveal = tgt.stage === 0 ? clamp(c.torch.x * 1.03) : 1;
  R.wpNest.setAttribute('stroke-dashoffset', (1 - reveal).toFixed(3));
  R.wpPrimer.setAttribute('opacity', w.paint.toFixed(2));

  const showShip = tgt.stage >= 4;
  R.ship.style.display = showShip ? '' : 'none';
  R.carry.style.display = showShip ? '' : 'none';
  R.ship.setAttribute('transform', move(YP, [c.ship.dx, 0, c.ship.dz]));
  R.ship.setAttribute('opacity', c.ship.op.toFixed(2));
  for (let i = 0; i < 6; i++) {
    R.pb[i].style.display = i < c.placed ? '' : 'none';
    const carrying = c.active === i && c.crane.load && showShip;
    R.cb[i].style.display = carrying ? '' : 'none';
    if (carrying) R.cb[i].setAttribute('transform', move(YP, [c.crane.load[0] - slotX(i), c.crane.load[1] - slotY(), c.crane.load[2] - slotZ()]));
  }
  // dock water
  const wt = dockWater(K, YP, DK, LAYOUT.floor, LAYOUT.seaLevel, c.water);
  R.dockTop.setAttribute('d', wt.top); R.dockBand.setAttribute('d', wt.band); R.wline.setAttribute('d', wt.line);
  R.gate.setAttribute('transform', move(YP, [0, 0, -c.gate * 44]));
  R.gate.setAttribute('opacity', (1 - c.gate * 0.8).toFixed(2));

  // goliath crane, trolley, rope, hook, slings
  const cr = c.crane;
  const dx = move(YP, [cr.gx - REST_GX, 0, 0]);
  R.craneFar.setAttribute('transform', dx); R.craneNear.setAttribute('transform', dx);
  R.trolley.setAttribute('transform', move(YP, [REST_GX, cr.ty, GIRDER_Z]));
  const top = iso([cr.gx, cr.ty, GIRDER_Z + 2], YP), hk = iso([cr.gx, cr.ty, cr.hook], YP);
  D_.rope.setAttribute('d', `M${pt(top)}L${pt(hk)}`);
  D_.hook.setAttribute('transform', move(YP, [cr.gx, cr.ty, cr.hook]));
  let sl = '';
  if (cr.load && c.active >= 0 && showShip) {
    const len = BLOCKS[c.active].len * 0.36, hz = cr.load[2] + HULL.height;
    const h0 = iso([cr.gx, cr.ty, cr.hook - 4], YP);
    for (const [sx, sy] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) sl += `M${pt(h0)}L${pt(iso([cr.load[0] + sx * len, cr.load[1] + sy * 11, hz], YP))}`;
  }
  D_.sling.setAttribute('d', sl);

  // quay crane and deckhouse: the jib swings from the pallet (angle 0) to the ship's deck; once down, the house rides with the ship
  const hs = c.house, onQuay = tgt.stage === 6;
  R.house.style.display = onQuay ? '' : 'none';
  if (onQuay) {
    const a = JIB_A1 * hs, landed = hs >= 0.999;
    const tipx = PIV[0] + JIB_R * Math.cos(a), tipy = PIV[1] + JIB_R * Math.sin(a);
    const bz = lerp(PAL[2], HB[2], hs) + 26 * Math.sin(Math.PI * hs);
    const off = landed ? [0, 0, 0] : [tipx - HB[0], tipy - HB[1], bz - HB[2]];
    R.house.setAttribute('transform', move(YP, [off[0] + c.ship.dx - LAYOUT.mooring.dx, off[1], off[2] + c.ship.dz - 15]));
    R.house.setAttribute('opacity', c.ship.op.toFixed(2));
    const piv = iso([PIV[0], PIV[1], PIV[2] + 4], YP), tip = iso([tipx, tipy, JIB_Z], YP);
    D_.boom.setAttribute('d', `M${pt(piv)}L${pt(tip)}`);
    D_.jrope.setAttribute('d', landed ? '' : `M${pt(tip)}L${pt(iso([tipx, tipy, bz + 34], YP))}`);
  } else { D_.boom.setAttribute('d', ''); D_.jrope.setAttribute('d', ''); }

  // cutting portal and torch, welding, blasting and spraying
  const tx = CUT.cx - 30 + 16 * c.torch.on + 28 * c.torch.x, ty = CUT.cy + Math.sin(c.torch.x * 38) * 7;
  portal.fixed.setAttribute('transform', move(YP, [tx, CUT.cy, 3]));
  portal.head.setAttribute('transform', move(YP, [tx, ty, -1]));
  const live = !S.reduced;
  FX.torch.setAttribute('d', live && c.torch.on > 0.5 ? sparksAt(YP, [tx, ty, 6.8], 9, S.clock, 7, 1) : '');
  FX.weld.setAttribute('d', live && c.weld > 0.5
    ? sparksAt(YP, [WELD.x + 26, WELD.y + 51.5, 10.4], 7, S.clock, 6, 3) + sparksAt(YP, [WELD.x + 26, WELD.y + 63.5, 10.4], 7, S.clock, 6, 5) + sparksAt(YP, [WELD.x + 56, WELD.y + 58, 10.2], 9, S.clock, 7, 7) : '');
  const px0 = c.wp.x, py0 = c.wp.y;
  FX.blast.setAttribute('d', live && c.blast > 0.5 ? dotsAround(YP, [px0, py0, 5], [20, 14, 22], 26, S.clock, 11) : '');
  FX.spray.setAttribute('d', live && c.spray > 0.5 ? dotsAround(YP, [px0, py0, 14], [20, 14, 12], 22, S.clock, 13) : '');
}

// ---- drawing the vessel -------------------------------------------------------------------------------------------------
const LAYER_EL = Object.fromEntries(Object.keys(GEO.vessel.nums.lift).map((k) => [k, $(`#lyr-${k}`)]));
const PROP = { back: svgEl('path', { class: 'blade back' }), front: svgEl('path', { class: 'blade' }) };
$('#v-prop').append(PROP.back, PROP.front);
const RAD = { beam: svgEl('path', { class: 'beam' }), bar: svgEl('path', { class: 'scanner' }) };
$('#v-radar').append(RAD.beam, RAD.bar);
function drawVessel() {
  for (const [k, el] of Object.entries(LAYER_EL)) {
    const sys = LAYER_SYS[k];
    el.style.display = S.layers[sys] ? '' : 'none';
    el.setAttribute('transform', move(VP, [0, 0, GEO.vessel.nums.lift[k] * X.explode]));
  }
  R.svgV.style.setProperty('--ballast', X.ballast.toFixed(3));
  const th = S.reduced ? 0.4 : S.prop;
  if (S.layers.engine) {
    const pr = propeller(K, VP, [VN.propX, 0, VN.shaftZ], VN.propR, SHIP.blades, th);
    PROP.front.setAttribute('d', pr.front.join('')); PROP.back.setAttribute('d', pr.back.join(''));
  }
  if (S.layers.nav) {
    const ra = S.reduced ? 0.7 : (S.clock * 2 * Math.PI) / radarPeriod();
    const r = radar(K, VP, VN.radar, ra);
    RAD.bar.setAttribute('d', r.bar); RAD.beam.setAttribute('d', S.reduced ? '' : r.beam);
  }
}

// ---- the loop ----------------------------------------------------------------------------------------------------------
function easeTo(c, t, dt, tau, snap) {
  for (const k of Object.keys(t)) {
    const a = c[k], b = t[k];
    if (k === 'readout') c[k] = b;
    else if (typeof b === 'number' && typeof a === 'number') c[k] = snap ? b : follow(a, b, dt, tau);
    else if (b && typeof b === 'object' && !Array.isArray(b) && a && typeof a === 'object') easeTo(a, b, dt, tau, snap);
    else c[k] = b;
  }
}
function paintUi() {
  $$('.step', R.stepper).forEach((b, i) => b.style.setProperty('--p', (i < S.stage ? 1 : i === S.stage ? S.u : 0).toFixed(3)));
}
function step(dt, draw = true) {
  S.clock += dt;
  tourTick(dt);
  tgt = yardAt(S.stage, S.u);
  const snap = S.snap || S.reduced;
  easeTo(cur, tgt, dt, 0.2, snap);
  for (const [k, v] of [['explode', S.explode], ['ballast', S.ballast], ['power', S.power]]) X[k] = snap ? v : follow(X[k], v, dt, 0.25);
  // the propeller angle is INTEGRATED from the (eased) angular speed, so a power change slows it down smoothly instead of jumping to clock*omega
  S.prop = (S.prop + (S.reduced ? 0 : propOmega(X.power) * dt)) % (2 * Math.PI);
  // numbers, captions and progress are state, not drawing: they update even while the figure is scrolled out of view (a phone);
  // only the SVG redraw, the camera and the tag placement are skipped then
  if (S.view === 'yard') { if (draw) drawYard(cur); renderCaption(); paintUi(); } else { if (draw) drawVessel(); renderVesselReadout(); }
  if (draw) { updateCamera(dt); placeTags(); S.snap = false; }
}
let last = performance.now(), warned = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, (now - last) / 1000);
  last = now;
  if (document.hidden) return;
  try { step(dt, S.visible); S.frames++; } catch (err) {
    S.errors++;
    if (S.errors <= 3) console.error('shipyard frame error', err);
    if (S.errors > 30 && !warned) { warned = true; R.fallback.hidden = false; }
  }
}

// ---- input -------------------------------------------------------------------------------------------------------------
for (const b of $$('.tab')) b.addEventListener('click', () => setView(b.dataset.view));
$('.tabs').addEventListener('keydown', (e) => {
  const tabs = $$('.tab'); const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  let n = -1;
  if (e.key === 'ArrowRight') n = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') n = (i + tabs.length - 1) % tabs.length;
  else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = tabs.length - 1;
  if (n < 0) return;
  e.preventDefault(); tabs[n].focus(); setView(tabs[n].dataset.view);
});
R.bNext.addEventListener('click', () => tour.next());
R.bPrev.addEventListener('click', () => tour.prev());
R.bPlay.addEventListener('click', () => tour.play());
R.bSkip.addEventListener('click', () => tour.skip());
R.bReset.addEventListener('click', () => tour.reset());
function slider(input, out, key, text) {
  input.addEventListener('input', () => {
    S[key] = Number(input.value) / 100;
    out.textContent = `${input.value}%`;
    say(text(S[key]));
    if (key !== 'explode') renderVesselReadout();     // the numbers answer at once, even when no frame is drawn (figure scrolled away)
  });
}
slider(R.rEx, R.oEx, 'explode', (v) => ({ kr: `분해 ${Math.round(v * 100)}%`, en: `Explode ${Math.round(v * 100)}%` }));
slider(R.rPw, R.oPw, 'power', (v) => ({ kr: `엔진 출력 ${Math.round(v * 100)}% · 선속 ${f1(speedAt(v))} kn`, en: `Engine power ${Math.round(v * 100)}% · speed ${f1(speedAt(v))} kn` }));
slider(R.rBa, R.oBa, 'ballast', (v) => ({ kr: `밸러스트 ${f0(ballastTonnes(v))} t · 흘수 ${f1(ballastDraft(v))} m`, en: `Ballast ${f0(ballastTonnes(v))} t · draft ${f1(ballastDraft(v))} m` }));
R.panelY.addEventListener('click', (e) => { const g = e.target.closest('[data-fac]'); if (g) select('fac', g.dataset.fac, 'svg'); });
R.panelV.addEventListener('click', (e) => {
  const it = e.target.closest('[data-item]');
  if (it && D.ITEMS[it.dataset.item]) { select('item', it.dataset.item, 'svg'); return; }
  const l = e.target.closest('[data-sys]');
  if (l) select('sys', l.dataset.sys, 'svg'); else clearSel('svg');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.sel) clearSel('key'); else if (S.playing) { setPlaying(false); say({ kr: '일시정지', en: 'Paused' }); }
    return;
  }
  if (e.target instanceof HTMLInputElement || e.target.closest('.tabs') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (S.view !== 'yard') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); tour.next(); } else if (e.key === 'ArrowLeft') { e.preventDefault(); tour.prev(); }
});
const onMotion = () => {
  S.reduced = mq.matches;
  document.documentElement.dataset.motion = S.reduced ? 'reduced' : 'full';
  if (S.reduced) { S.u = 1; S.snap = true; say({ kr: D.UI.reduced.kr, en: D.UI.reduced.en }); } else say({ kr: '움직임을 다시 켰습니다', en: 'Motion is on again' });
};
mq.addEventListener('change', onMotion);
new ResizeObserver(() => { measure(); S.snap = true; }).observe(R.vp);
new IntersectionObserver((es) => { S.visible = es.some((e) => e.isIntersecting); }).observe(R.vp);

// ---- start -------------------------------------------------------------------------------------------------------------
document.documentElement.dataset.motion = S.reduced ? 'reduced' : 'full';
renderLayers(); renderStepper(); setPlaying(false); setView('yard', true);
say({ kr: `${D.UI.hintYard.kr}`, en: `${D.UI.hintYard.en}` });
if (S.reduced) S.u = 1;
requestAnimationFrame(frame);

// ---- the hook for tests and curious people ---------------------------------------------------------------------------------
window.__shipyard = {
  S, cur, X,
  get target() { return tgt; },
  seek(stage, u = 0) { setPlaying(false); S.stage = clamp(Math.round(stage), 0, 6); S.u = clamp(u); S.sel = null; S.overview = false; S.snap = true; renderStepper(); renderCard(); syncDim(); syncChips(); buildTags(); },
  setView, select, clearSel, tour,
  advance(seconds) { step(seconds); },
  screenPos(id) {
    const e = R.tags.querySelector(`[data-tag="${id}"]`) || $(`[data-chip="${id}"]`) || $(`[data-fac="${id}"]`) || $(`[data-item="${id}"]`) || $(`[data-sys="${id}"]`);
    if (!e) return null;
    const r = e.getBoundingClientRect();
    return { x: r.x + r.width / 2, y: r.y + r.height / 2, w: r.width, h: r.height };
  },
  snapshot() {
    return {
      view: S.view, stage: S.stage, u: S.u, playing: S.playing, sel: S.sel, layers: { ...S.layers }, explode: S.explode, power: S.power, ballast: S.ballast,
      reduced: S.reduced, status: S.status, frames: S.frames, errors: S.errors,
      water: tgt.water, placed: tgt.placed, active: tgt.active, crane: tgt.crane.phase, ship: { ...tgt.ship }, readout: { ...tgt.readout },
      drawn: { water: cur.water, placed: cur.placed, shipDx: cur.ship.dx, wp: { ...cur.wp } },
      viewBox: (S.view === 'yard' ? R.svgY : R.svgV).getAttribute('viewBox'), overview: S.overview,
      prop: S.prop, visible: S.visible,
    };
  },
  model: { yardAt, craneCycle, floodHours, floatLevel, lightDraft, rpmAt, speedAt, tipSpeed, ballastDraft, ballastTonnes, SHIP, DOCK, HULL, BLOCKS },
};
</script>
</body>
