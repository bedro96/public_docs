        - list [ref=e364]:
          - listitem [ref=e365]:
            - paragraph [ref=e366]: 《손자병법》은 속임수 모음집이 아니에요
            - paragraph [ref=e367]: 〈시계〉에 “병자 궤도야(전쟁은 속이는 길)”라는 말이 있는 건 맞아요. 하지만 같은 편이 전쟁을 “나라의 큰일”이라 하며 미리 따져 보라고 해요. 속임은 일부이고 책의 중심은 계산과 판단이에요.
          - listitem [ref=e368]:
            - paragraph [ref=e369]: 《삼십육계》는 《손자병법》이 아니에요
            - paragraph [ref=e370]: 《삼십육계》는 후대에 알려진 별개의 책이에요. 《손자병법》 열세 편 본문과 섞어 읽으면 두 책을 모두 오해하기 쉬워요.
          - listitem [ref=e371]:
            - paragraph [ref=e372]: ‘싸우지 않는다’는 ‘피한다’나 ‘겁쟁이’가 아니에요
            - paragraph [ref=e373]: 원문이 가장 좋게 치는 것은 싸우지 않고도 이길 조건을 만드는 일이에요. 〈모공〉은 힘의 차이에 따라 에워싸고, 치고, 맞서고, 지키고, 피하라고 가려서 말해요. 피하는 것도 판단의 하나일 뿐이에요.
          - listitem [ref=e374]:
            - paragraph [ref=e375]: 손무와 손빈은 같은 사람이 아니에요
            - paragraph [ref=e376]: 《사기》는 손빈을 손무의 후손이라 전하고, 《한서》 예문지는 《오손자》와 《제손자》를 따로 적었어요. 1972년 은작산 한묘 죽간에서 두 책이 함께 나와 구별이 뒷받침됐어요. 다만 손무의 실존과 열세 편의 성립 시기는 학계 논쟁이 남아 있어요.
